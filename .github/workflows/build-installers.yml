name: Build installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        shell: bash
        run: |
          npm install 2>&1 | tee log-install.txt; test ${PIPESTATUS[0]} -eq 0 || { echo "::error::INSTALL: $(tail -c 1200 log-install.txt | tr '\n' ' ')"; exit 1; }
      - name: Web build
        shell: bash
        run: |
          npm run build 2>&1 | tee log-build.txt; test ${PIPESTATUS[0]} -eq 0 || { echo "::error::WEBBUILD: $(tail -c 1500 log-build.txt | tr '\n' ' ')"; exit 1; }
      - name: Package
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npx electron-builder --${{ matrix.target }} 2>&1 | tee log-pack.txt; test ${PIPESTATUS[0]} -eq 0 || { echo "::error::PACK: $(tail -c 1500 log-pack.txt | tr '\n' ' ')"; exit 1; }
      - name: Publish logs on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p /tmp/logs && cp log-*.txt /tmp/logs/ 2>/dev/null
          git config user.name ci && git config user.email ci@example.com
          git checkout --orphan buildlogs-${{ matrix.target }} && git rm -rf . >/dev/null 2>&1
          cp /tmp/logs/* . && git add log-*.txt && git commit -m logs && git push -f origin buildlogs-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
